name: Mobile emulation screenshots

on:
  push:
    branches:
      - codex/top-level-language-and-navigation
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "translations.js"
      - "tests/mobile-emulation-smoke.cjs"
      - "tests/mobile-emulation.yml"
      - ".github/workflows/mobile-emulation.yml"

permissions:
  contents: read

jobs:
  mobile-emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install --no-save playwright yaml
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-emulation-smoke.cjs tests/mobile-emulation.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-emulation-screenshots
          path: artifacts/mobile-emulation/
          if-no-files-found: warn
          retention-days: 14
